name: Нагадування Quaderno
on:
  schedule:
    - cron: '0 17 * * *'   # 19:00 за Києвом (зима)
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save web-push@3.6.7
      - run: node push/send.js
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
